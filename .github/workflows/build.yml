name: Build Football Auction APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q "$(find . -maxdepth 1 -name '*.zip' -print -quit)" -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballAuction-APK
          path: '${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk'
